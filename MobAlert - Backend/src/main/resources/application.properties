spring.application.name=Women-Safety

gemini.api.key=${GEMINI_API_KEY:}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent}

# ==========================
# Database
# ==========================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geowatch}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA & Hibernate
# ==========================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.jakarta.persistence.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/geowatch}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# ==========================
# HikariCP Connection Pool
# ==========================
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================
# Server Configuration
# ==========================
server.address=0.0.0.0
server.port=${PORT:8080}

# ==========================
# Actuator & Observability
# ==========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.metrics.enabled=true
management.endpoint.health.show-details=when-authorized

# ==========================
# Frontend & CORS
# ==========================
frontend.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://mobalert.vercel.app,https://geo-watch.pages.dev}

